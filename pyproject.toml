[project]
name = "otter-finance-manager"
version = "0.1.0"
description = "Django webapp for shared and personal expense tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3,<6.2",
    "gunicorn>=27.0.1,<28",
    "whitenoise>=6.12,<7",
    "dj-database-url>=3.1.2,<4",
    "psycopg2-binary>=2.9.13,<3",
]

[dependency-groups]
dev = [
    "coverage>=7",
    "pytest>=9.2,<10",
    "pytest-django>=4.14,<5",
    "ruff>=0.17.6,<0.18",
]

[tool.hatch.build.targets.wheel]
packages = ["otter_finance_manager"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
# RUF012: Django's declarative class attributes (Meta, fields, widgets) are idiomatic.
extend-ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "otter_finance_manager.settings"
python_files = ["test_*.py"]
