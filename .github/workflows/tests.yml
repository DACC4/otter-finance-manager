name: Tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check migrations
        env:
          DJANGO_DEBUG: "1"
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Test
        run: uv run python manage.py test

      - name: Audit dependencies for known vulnerabilities
        run: |
          uv export --locked --all-groups --no-hashes --no-emit-project > requirements-audit.txt
          uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip
