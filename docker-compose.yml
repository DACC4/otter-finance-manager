services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: otter
      POSTGRES_PASSWORD: otter
      POSTGRES_DB: otter
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otter -d otter"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Required. Put it in a .env file next to this compose file (gitignored):
      #   DJANGO_SECRET_KEY=<output of: python -c "import secrets; print(secrets.token_urlsafe(50))">
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"
      DJANGO_DEBUG: "False"
      DATABASE_URL: "postgres://otter:otter@db:5432/otter"
      DJANGO_ALLOWED_HOSTS: "*"
      # Behind an HTTPS reverse proxy, also set:
      # DJANGO_CSRF_TRUSTED_ORIGINS: "https://finance.example.com"
      # DJANGO_HTTPS: "true"
      # DJANGO_BEHIND_PROXY: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
